{% extends 'common2.html' %}

    {% block title2 %}password reset{% endblock title2 %}
    {% block body_content2 %}
    {% load static %}
    <div style="margin-top: 10vh;  padding:40px;">
        <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4 col-12 border shadow rounded p-4 mt-3">
            <h5 class="fw-semibold mb-2">Reset Password</h5>
            <p class="text-secondary small">Please enter your email address to receive the password reset link.</p>
            <form method='post'>
                {% csrf_token %}
                {% load crispy_forms_tags %}
                {{form|crispy}}

                <div class="mt-3">
                    <input class='bc-white loginbutton' type='submit' value='Send'>
                </div>
            </form>
        </div>
        </div>
    </div>
    {% endblock %}
