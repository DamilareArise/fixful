{% extends 'common2.html' %}

    {% block title2 %}Login{% endblock title2 %}
    {% block body_content2 %}
    {% load static %}
    <div style="margin-top: 9vh; padding:40px;">
        <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4 col-12 border shadow rounded p-4 mt-3">
            <h5 class="fw-semibold mb-3">Login</h5>
            <form method='post'>
                {% csrf_token %}
                {% load crispy_forms_tags %}
                {{form|crispy}}

                <div class="d-flex justify-content-between align-items-center mt-3">
                    <input class='btn btn-primary' type='submit' value='Login'>
                    <a href="{% url 'password_reset' %}" class="text-secondary small">Forgot password?</a>
                </div>
            </form>
        </div>
        </div>
    </div>
        {% endblock %}
